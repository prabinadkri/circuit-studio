name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select browser
        run: node -e "console.log('CHROME_BIN='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Install lab firmware toolchains
        run: sudo apt-get update && sudo apt-get install -y gputils gcc-avr avr-libc ngspice
      - run: npm run build:examples
      - run: npm run build
      - run: npm test
      - run: npm run test:engine
      - run: npm run test:automation
      - name: Package verified offline sources and runtime assets
        run: python3 scripts/package.py --output circuit-studio-linux-x86_64.tar.gz
